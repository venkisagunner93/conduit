name: Publish conduit-tools-forge to PyPI

on:
  push:
    branches:
      - main
    paths:
      - "tools/conduit-forge/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with test dependencies
        run: pip install -e "tools/conduit-forge[test]"

      - name: Run tests
        run: pytest tools/conduit-forge/tests/ -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auto-bump patch version if needed
        run: |
          LOCAL=$(grep -oP 'version = "\K[^"]+' tools/conduit-forge/pyproject.toml)
          PYPI=$(pip index versions conduit-tools-forge 2>/dev/null | grep -oP '\(\K[^)]+' || echo "0.0.0")
          LOCAL_MAJ_MIN="${LOCAL%.*}"
          PYPI_MAJ_MIN="${PYPI%.*}"
          PYPI_PATCH="${PYPI##*.}"
          if [ "$LOCAL_MAJ_MIN" = "$PYPI_MAJ_MIN" ]; then
            NEW_VERSION="${LOCAL_MAJ_MIN}.$((PYPI_PATCH + 1))"
            sed -i "s/version = \"$LOCAL\"/version = \"$NEW_VERSION\"/" tools/conduit-forge/pyproject.toml
            echo "Bumped version: $LOCAL -> $NEW_VERSION"
          else
            echo "Major/minor changed: using $LOCAL as-is"
          fi

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build tools/conduit-forge/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: tools/conduit-forge/dist/
