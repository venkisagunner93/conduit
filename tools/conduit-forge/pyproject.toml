[project]
name = "conduit-tools-forge"
version = "0.1.0"
description = "Build tool for Conduit packages"
requires-python = ">=3.10"
dependencies = ["tomli>=2.0.0;python_version<'3.11'", "art==6.5"]
readme = "README.md"
license = {text = "MIT"}
keywords = ["build", "robotics", "conduit", "cmake"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/venkisagunner93/conduit"
Repository = "https://github.com/venkisagunner93/conduit"
Issues = "https://github.com/venkisagunner93/conduit/issues"

[project.scripts]
forge = "conduit_forge.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
